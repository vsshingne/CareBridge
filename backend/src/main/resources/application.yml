spring:
  application:
    name: carebridge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/carebridge}
    username: ${DATABASE_USER:carebridge}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: carebridge-notifications-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: when_authorized
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db,redis,kafka
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
    org.hibernate.SQL: WARN
  structured.format.console: logstash
app:
  jwt-secret: ${JWT_SECRET}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  secure-cookies: ${SECURE_COOKIES:true}
  jobs-enabled: ${JOBS_ENABLED:true}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}

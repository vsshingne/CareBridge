name: CareBridge CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_render:
        description: Deploy the tested main commit to the configured Render service
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral local configuration
        shell: bash
        run: |
          echo "DATABASE_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> .env
          echo 'SECURE_COOKIES=false' >> .env
          echo 'ADMIN_EMAIL=admin@carebridge.example' >> .env
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "DEMO_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:3000/ && curl --fail http://localhost:8080/actuator/health
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/seed-demo.mjs
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results
      - name: Teardown
        if: always()
        run: docker compose down -v
  release-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carebridge-backend:${{ github.sha }} backend
      - run: docker build -t carebridge-frontend:${{ github.sha }} frontend
      - run: docker save carebridge-backend:${{ github.sha }} carebridge-frontend:${{ github.sha }} | gzip > carebridge-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: carebridge-images-${{ github.sha }}
          path: carebridge-images.tar.gz
          retention-days: 7
  deploy-render:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_render && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: carebridge-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy tested commit and verify readiness and revision
        run: python scripts/deploy-render.py
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}

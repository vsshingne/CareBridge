# Standalone: managed PostgreSQL, Redis and Kafka; host TLS proxy forwards to port 3000.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      SECURE_COOKIES: "true"
      SPRING_PROFILES_ACTIVE: production
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      backend: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
